name: expense_tracker
description: "An AI powered expense tracker app built with flutter + Firebase authentication to make it easier for users to authenticate"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  fl_chart: ^1.2.0
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.1
  google_fonts: ^8.2.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  timezone: ^0.11.1
  http: ^1.6.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  flutter_launcher_icons: ^0.14.4

# Launcher Icons Configuration (Root level)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "asset/ChatGPT Image Sep 30, 2026, 12_13_40 PM.png"

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Registered your asset folder here so the build system can package the icon image
  assets:
    - asset/








